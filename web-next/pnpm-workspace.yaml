packages:
  - .
verifyDepsBeforeRun: error
enablePrePostScripts: true
strictDepBuilds: true
skills:
  dirs: []
allowBuilds:
  better-sqlite3: true
  sharp: true
  unrs-resolver: true
  esbuild: true
  '@better-auth/telemetry': false
  core-js: false
  '@prisma/client': false
# shortcut: isolate compiler API consumers until ESLint supports the native compiler API.
packageExtensions:
  typescript-eslint:
    dependencies:
      typescript: 6.0.3
  '@typescript-eslint/eslint-plugin':
    dependencies:
      typescript: 6.0.3
  '@typescript-eslint/parser':
    dependencies:
      typescript: 6.0.3
  '@typescript-eslint/utils':
    dependencies:
      typescript: 6.0.3
  '@typescript-eslint/type-utils':
    dependencies:
      typescript: 6.0.3
  '@typescript-eslint/typescript-estree':
    dependencies:
      typescript: 6.0.3
  '@typescript-eslint/project-service':
    dependencies:
      typescript: 6.0.3
  '@typescript-eslint/tsconfig-utils':
    dependencies:
      typescript: 6.0.3
  ts-api-utils:
    dependencies:
      typescript: 6.0.3
  eslint-import-resolver-typescript:
    dependencies:
      typescript: 6.0.3
overrides:
  'typescript-eslint>typescript:peer': '-'
  '@typescript-eslint/*>typescript:peer': '-'
  'ts-api-utils>typescript:peer': '-'
  'eslint-import-resolver-typescript>typescript:peer': '-'
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.25'
  - '@better-auth/drizzle-adapter@1.7.25'
  - '@better-auth/kysely-adapter@1.7.25'
  - '@better-auth/memory-adapter@1.7.25'
  - '@better-auth/mongo-adapter@1.7.25'
  - '@better-auth/prisma-adapter@1.7.25'
  - '@better-auth/telemetry@1.7.25'
  - auth@1.7.25
  - better-auth@1.7.25
  - better-sqlite3@13.2.0
  - lucide-react@1.73.0
